services:
  - type: web
    name: duovel-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn duovel.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DJANGO_SETTINGS_MODULE
        value: duovel.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
